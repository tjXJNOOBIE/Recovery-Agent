<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recovery Agent</title>
  <style>
    :root{color-scheme:dark;--bg:#07131f;--panel:rgba(14,29,45,.78);--panel2:rgba(19,38,57,.72);--line:rgba(168,211,239,.15);--text:#eef7ff;--muted:#9fb7c9;--dim:#668298;--blue:#75c8ff;--green:#77e1b1;--amber:#ffd078;--red:#ff9292;--shadow:0 24px 70px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#1e4969 0,transparent 60%),radial-gradient(700px 520px at -15% 90%,#123b51 0,transparent 55%),var(--bg);color:var(--text);font-size:14px}button{font:inherit;color:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{border-right:1px solid var(--line);padding:24px 14px 18px;display:flex;flex-direction:column;background:rgba(4,12,20,.44);backdrop-filter:blur(24px)}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 26px}.brand-mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#8bd6ff,#2b759e);color:#04101b;font-weight:900;box-shadow:0 7px 20px rgba(74,171,224,.25)}.brand strong{font-size:14px;letter-spacing:-.02em}.brand span{display:block;font-size:10px;color:var(--dim);margin-top:2px}.nav-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);padding:0 11px 8px}.nav{display:grid;gap:3px;margin-bottom:22px}.nav button{appearance:none;border:0;background:transparent;text-align:left;border-radius:10px;padding:10px 11px;color:var(--muted);display:flex;align-items:center;gap:10px;font-size:12.5px}.nav button:hover{background:rgba(255,255,255,.06);color:var(--text)}.nav button.active{background:rgba(112,197,246,.14);color:#eaf7ff;box-shadow:inset 2px 0 var(--blue)}.nav-icon{width:18px;color:var(--dim);font-size:15px;text-align:center}.active .nav-icon{color:var(--blue)}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px 0;color:var(--dim);font-size:11px;line-height:1.45}.host{display:flex;gap:7px;align-items:center;margin-top:8px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(119,225,177,.11)}.content{min-width:0}.topbar{max-width:1220px;margin:auto;padding:33px 46px 22px;display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:750}.topbar h1{margin:8px 0 6px;font-size:34px;line-height:1.05;letter-spacing:-.045em}.topbar p{margin:0;color:var(--muted);max-width:660px;line-height:1.45}.status-cluster{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.status{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:11px;white-space:nowrap;background:rgba(11,25,39,.55)}.status.live{color:var(--green);border-color:rgba(119,225,177,.3)}.status.warn{color:var(--amber);border-color:rgba(255,208,120,.35)}.main{max-width:1220px;margin:auto;padding:0 46px 42px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.7fr);gap:14px}.panel,.mini{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(22px)}.panel{padding:21px}.mini{padding:17px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.panel h2{font-size:17px;letter-spacing:-.02em;margin:0}.panel h3,.mini h3{font-size:13px;margin:0 0 5px}.panel-head p,.mini p{color:var(--muted);line-height:1.45;margin:5px 0 0;font-size:12px}.pill{border:1px solid rgba(117,200,255,.28);background:rgba(117,200,255,.1);color:var(--blue);border-radius:999px;padding:5px 8px;font-size:10px;white-space:nowrap}.request{font-size:22px;line-height:1.25;letter-spacing:-.03em;border-left:3px solid var(--blue);padding:2px 0 2px 14px;margin:14px 0 19px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meta-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(5,16,27,.28)}.meta-item small{display:block;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-size:9px;margin-bottom:6px}.meta-item b{display:block;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note{color:var(--muted);font-size:12px;line-height:1.5;margin:17px 0 0}.btn{appearance:none;border:1px solid rgba(175,219,243,.2);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 13px;color:var(--text);font-weight:650;font-size:12px}.btn:hover{background:rgba(255,255,255,.14)}.btn.primary{background:#edf8ff;color:#08131e;border-color:#edf8ff}.btn.amber{background:rgba(255,208,120,.16);border-color:rgba(255,208,120,.4);color:var(--amber)}.btn:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;background:rgba(5,16,27,.28);padding:11px 12px}.step.done{border-color:rgba(119,225,177,.3);background:rgba(14,67,55,.3)}.step.active{border-color:rgba(255,208,120,.4);background:rgba(86,59,18,.3)}.step.failed{border-color:rgba(255,146,146,.38);background:rgba(99,32,32,.3)}.step-num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(117,200,255,.16);color:var(--blue);font-size:11px;font-weight:800}.done .step-num{background:rgba(119,225,177,.18);color:var(--green)}.active .step-num{background:rgba(255,208,120,.18);color:var(--amber)}.step strong{display:block;font-size:12px}.step small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.35}.step-state{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.done .step-state{color:var(--green)}.active .step-state{color:var(--amber)}.subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.metric{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.metric:first-child{border-top:0}.metric span{color:var(--muted)}.metric b{font-weight:650}.good{color:var(--green)}.warn-text{color:var(--amber)}.bad{color:var(--red)}.route{display:flex;gap:7px;overflow:auto;padding:3px 0 4px}.route-node{min-width:145px;border:1px solid var(--line);border-radius:13px;background:rgba(5,16,27,.3);padding:12px}.route-node b{display:block;font-size:12px}.route-node span{display:block;color:var(--muted);font-size:10px;line-height:1.35;margin-top:5px}.route-arrow{align-self:center;color:var(--dim);font-size:17px}.json{background:#030b13;border:1px solid rgba(175,219,243,.12);border-radius:12px;padding:13px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#c7d9e6;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.toast{position:fixed;right:24px;bottom:24px;background:#eaf7ff;color:#08131e;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.label{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:20px 0 9px}.footer-line{display:flex;justify-content:space-between;gap:10px;color:var(--dim);font-size:10px;margin-top:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:13px 15px}.brand{padding:0 7px 12px}.nav{display:flex;overflow:auto;margin:0}.nav-label,.side-foot{display:none}.nav button{white-space:nowrap}.topbar,.main{padding-left:20px;padding-right:20px}.topbar{display:block}.status-cluster{justify-content:flex-start;margin-top:13px}.grid,.subgrid{grid-template-columns:1fr}}@media(max-width:560px){.topbar h1{font-size:28px}.meta{grid-template-columns:1fr}.step{grid-template-columns:27px 1fr}.step-state{display:none}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">R</div><div><strong>Recovery Agent</strong><span>Control host</span></div></div>
    <div class="nav-label">Workflow</div>
    <nav class="nav" id="nav">
      <button data-route="incident"><span class="nav-icon">⌁</span>Incident</button>
      <button data-route="observe"><span class="nav-icon">◉</span>Observe</button>
      <button data-route="policy"><span class="nav-icon">◇</span>Policy</button>
      <button data-route="recover"><span class="nav-icon">↻</span>Recover</button>
      <button data-route="verify"><span class="nav-icon">✓</span>Verify</button>
      <button data-route="audit"><span class="nav-icon">≡</span>Audit</button>
    </nav>
    <div class="nav-label">Product</div>
    <nav class="nav"><button data-route="mcp"><span class="nav-icon">⌘</span>MCP boundary</button></nav>
    <div class="side-foot">Development target<div class="host"><span class="dot"></span><span>Java MCP · loopback</span></div></div>
  </aside>
  <div class="content">
    <header class="topbar"><div><div class="eyebrow">Recovery Agent · Java authority</div><h1 id="page-title">Recover with evidence.</h1><p id="page-subtitle">Observe the named service, apply deterministic policy, and verify the result after a bounded action.</p></div><div class="status-cluster"><div class="status live" id="java-status">● Java MCP</div><div class="status" id="target-status">Target configured</div></div></header>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const target={nodeId:'__RECOVERY_NODE_ID__',serviceId:'__RECOVERY_SERVICE_ID__'};
const titles={incident:['Recover with evidence.','Start with the user request and the exact configured target.'],observe:['Observe the target.','The Recovery Agent reads the node and service through the Java boundary.'],policy:['Policy before mutation.','Deterministic eligibility, dependencies, and restart budget are visible before action.'],recover:['A bounded recovery.','The operator-only Java action is target-bound and followed by health polling.'],verify:['Verify what became true.','Recovery is complete only after a fresh authoritative observation passes.'],audit:['Accountable by default.','Keep the request, decision, action, and verification together.'],mcp:['MCP boundary.','Inspect the model-safe view separately from the trusted operator surface.']};
let route='incident',sessionId='',nextId=1,connected=false;
const state={observation:null,readiness:null,recovery:null,verification:null,history:[]};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const json=v=>{try{return JSON.stringify(v,null,2)}catch{return String(v??'')}};
function toast(value){const node=document.getElementById('toast');node.textContent=value;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2200)}
function button(label,cls='btn',action=''){return '<button class="'+cls+'" data-action="'+esc(action)+'">'+esc(label)+'</button>'}
function pageShell(content){document.getElementById('main').innerHTML=content;document.querySelectorAll('[data-action]').forEach(n=>n.addEventListener('click',()=>actions(n.dataset.action)));document.querySelectorAll('[data-route]').forEach(n=>n.classList.toggle('active',n.dataset.route===route))}
function statusClass(value){return value?'done':'active'}
function step(number,label,detail,status){return '<div class="step '+status+'"><div class="step-num">'+number+'</div><div><strong>'+esc(label)+'</strong><small>'+esc(detail)+'</small></div><div class="step-state">'+(status==='done'?'Done':status==='active'?'Next':'Pending')+'</div></div>'}
function targetCard(){return '<div class="meta"><div class="meta-item"><small>Node</small><b>'+esc(target.nodeId)+'</b></div><div class="meta-item"><small>Service</small><b>'+esc(target.serviceId)+'</b></div><div class="meta-item"><small>Authority</small><b>Java Recovery MCP</b></div><div class="meta-item"><small>Transport</small><b>Loopback HTTP</b></div></div>'}
function routeSteps(){const healthy=state.observation?.healthy===true||state.verification?.healthy===true;return '<div class="steps">'+step(1,'Observe the named service','service_inspect reads the configured node and service.',state.observation?'done':'active')+step(2,'Evaluate policy and budget','recovery_readiness checks dependencies and restart eligibility.',state.readiness?'done':state.observation?'active':'')+step(3,'Execute one bounded action','recovery_recover is trusted-operator-only and target-bound.',state.recovery?'done':state.readiness&&!healthy?'active':'')+step(4,'Verify resulting health','A fresh service inspection must report healthy.',state.verification?.healthy?'done':state.recovery?'active':'')+'</div>'}
function incident(){return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Incident intake</h2><p>A concrete request becomes a traceable recovery operation.</p></div><span class="pill">Java authority</span></div><div class="request">“Recover the configured development service after its health check fails.”</div>'+targetCard()+'<p class="note">The product never accepts a caller-supplied unit, shell command, probe URL, or credential. The target is resolved from the machine-owned Recovery control configuration.</p><div class="actions">'+button('Inspect live service','btn primary','inspect')+button('Open MCP boundary','btn','mcp')+'</div></section><aside class="mini"><h3>Workflow state</h3>'+routeSteps()+'<div class="footer-line"><span>Current state</span><b class="'+(state.verification?.healthy?'good':'')+'">'+(state.verification?.healthy?'VERIFIED':'READY')+'</b></div></aside></div><div class="subgrid"><div class="mini"><h3>What Recovery owns</h3><p>Observation, deterministic policy, durable restart intent, operator boundary, and post-action verification.</p></div><div class="mini"><h3>What the node owns</h3><p>A narrow typed health and restart endpoint. No arbitrary shell execution is exposed to the model.</p></div></div>'}
function observe(){const o=state.observation;return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Live observation</h2><p>Read-only service state from the Java Recovery Agent.</p></div><span class="status '+(o?.healthy?'live':'warn')+'">'+(o?o.healthy?'HEALTHY':'UNHEALTHY':'NOT OBSERVED')+'</span></div>'+(!o?'<div class="empty">No observation yet. Request one from the Java control plane.</div>':'<div class="subgrid" style="margin-top:0"><div class="mini"><h3>Service state</h3><div class="metric"><span>Lifecycle</span><b>'+esc(o.lifecycleState||o.state||'unknown')+'</b></div><div class="metric"><span>Healthy</span><b class="'+(o.healthy?'good':'bad')+'">'+(o.healthy?'true':'false')+'</b></div><div class="metric"><span>Observed</span><b>'+esc(o.observedAt||'live')+'</b></div></div><div class="mini"><h3>Health evidence</h3><p>'+esc(o.detail||o.message||'The configured node returned a service observation.')+'</p></div></div><div class="label">Node response</div><pre class="json">'+esc(json(o))+'</pre>')+'<div class="actions">'+button('Refresh observation','btn primary','inspect')+button('Open policy','btn','policy')+'</div></section><aside class="mini"><h3>Recovery chain</h3>'+routeSteps()+'</aside></div>'}
function policy(){const r=state.readiness;return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Policy and budget</h2><p>Recovery determines whether a mutation is allowed before invoking the node.</p></div><span class="pill">Read-only</span></div>'+(!r?'<div class="empty">Request readiness after observing the target.</div>':'<pre class="json">'+esc(json(r))+'</pre>')+'<div class="route" style="margin-top:17px"><div class="route-node"><b>Configured target</b><span>'+esc(target.nodeId+'/'+target.serviceId)+'</span></div><div class="route-arrow">→</div><div class="route-node"><b>Dependencies</b><span>Checked before mutation</span></div><div class="route-arrow">→</div><div class="route-node"><b>Restart budget</b><span>Durable and target-bound</span></div></div><div class="actions">'+button('Evaluate readiness','btn primary','readiness')+button('Open recovery','btn amber','recover')+'</div></section><aside class="mini"><h3>Guardrails</h3><div class="metric"><span>Unit selection</span><b>Configured</b></div><div class="metric"><span>Shell access</span><b>Unavailable</b></div><div class="metric"><span>Dependency order</span><b>Required</b></div><div class="metric"><span>Operator action</span><b>Explicit</b></div></aside></div>'}
function recover(){const r=state.recovery;return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Bounded recovery</h2><p>One Java operator call, one configured service, and a bounded post-action health poll.</p></div><span class="pill">Trusted operator</span></div><div class="boundary" style="border:1px solid rgba(255,208,120,.35);background:rgba(255,208,120,.09);border-radius:13px;padding:13px;color:var(--muted)"><strong style="display:block;color:var(--amber);margin-bottom:4px">Approval boundary</strong>The model-facing catalog can observe and reason. This mutation is published only on the trusted Java operator surface.</div>'+(!r?'<p class="note">When the observation is unhealthy and policy permits, run the action below. The external service state changes only through the configured typed node gateway.</p>':'<div class="label">Java recovery result</div><pre class="json">'+esc(json(r))+'</pre>')+'<div class="actions">'+button(r?'Refresh verification':'Run bounded recovery','btn amber','recover-now')+button('Open verification','btn','verify')+'</div></section><aside class="mini"><h3>Before action</h3>'+routeSteps()+'<p class="note">No payment, credential, arbitrary command, or unconfigured target can be supplied here.</p></aside></div>'}
function verify(){const v=state.verification;return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Verification receipt</h2><p>Recovery is not complete until the authoritative service observation is healthy.</p></div><span class="status '+(v?.healthy?'live':'warn')+'">'+(v?.healthy?'VERIFIED':'WAITING')+'</span></div><div class="steps">'+step(1,'Mutation accepted','The Java recovery handler completed the bounded node action.',state.recovery?'done':'active')+step(2,'Fresh service observation','The same configured target is inspected after the action.',state.verification?'done':state.recovery?'active':'')+step(3,'Healthy result','Configured lifecycle and application probes pass.',v?.healthy?'done':'')+'</div>'+(!v?'<div class="empty" style="margin-top:16px">No post-action observation yet.</div>':'<div class="label">Authoritative response</div><pre class="json">'+esc(json(v))+'</pre>')+'<div class="actions">'+button('Verify now','btn primary','verify-now')+button('Open audit','btn','audit')+'</div></section><aside class="mini"><h3>Result</h3><div class="metric"><span>Service</span><b>'+esc(target.serviceId)+'</b></div><div class="metric"><span>Healthy</span><b class="'+(v?.healthy?'good':'bad')+'">'+(v?v.healthy?'true':'false':'—')+'</b></div><div class="metric"><span>Proof</span><b>'+esc(v?.detail||'Fresh read required')+'</b></div></aside></div>'}
function audit(){return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Operation history</h2><p>Client-visible evidence is paired with the Java MCP responses; durable audit remains Java-owned.</p></div><span class="pill">Trace</span></div><div class="steps">'+(state.history.length?state.history.map((h,i)=>step(i+1,h.label,h.detail,h.ok?'done':'failed')).join(''):'<div class="empty">No actions recorded in this demo session yet.</div>')+'</div><div class="label">Latest response</div><pre class="json">'+esc(json(state.history.at(-1)?.result||{}))+'</pre></section><aside class="mini"><h3>Accountability</h3><p>Each operation records its configured target, boundary, result, and next verification step. Client history is not authoritative state.</p>'+button('Return to incident','btn','incident')+'</aside></div>'}
function mcpPage(){return '<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Java MCP boundary</h2><p>Loopback development transport for the same canonical catalog used by product hosts.</p></div><span class="status live">/mcp</span></div><div class="subgrid" style="margin-top:0"><div class="mini"><h3>Model-safe view</h3><p>fleet_status, node_inspect, service_inspect, and recovery_invoke are visible to Strands.</p></div><div class="mini"><h3>Trusted view</h3><p>recovery_recover and operator approval remain outside the model-facing catalog.</p></div></div><pre class="json" id="mcp-output">'+esc(connected?json({tools:state.tools||[],transport:'Streamable HTTP',authority:'Java'}):'Connect to load live discovery.')+'</pre><div class="actions">'+button(connected?'Refresh discovery':'Connect and inspect','btn primary','load-mcp')+'</div></section><aside class="mini"><h3>Boundary facts</h3><div class="metric"><span>Transport</span><b>Streamable HTTP</b></div><div class="metric"><span>Host</span><b>Loopback only</b></div><div class="metric"><span>Mutation</span><b>Operator Java</b></div><div class="metric"><span>Credentials</span><b>Node-owned</b></div></aside></div>'}
function render(){const info=titles[route]||titles.incident;document.getElementById('page-title').textContent=info[0];document.getElementById('page-subtitle').textContent=info[1];document.getElementById('target-status').textContent=target.nodeId+'/'+target.serviceId;pageShell(({incident,observe,policy,recover,verify,audit,mcp:mcpPage}[route]||incident)())}
function record(label,detail,result,ok=true){state.history.push({label,detail,result,ok})}
async function mcp(method,params={},notification=false){const body={jsonrpc:'2.0',...(notification?{}:{id:nextId++}),method,params};const headers={'accept':'application/json, text/event-stream','content-type':'application/json','mcp-protocol-version':'2025-11-25'};if(sessionId)headers['mcp-session-id']=sessionId;const response=await fetch('/mcp',{method:'POST',headers,body:JSON.stringify(body)});const returned=response.headers.get('mcp-session-id');if(returned)sessionId=returned;const raw=await response.text();if(notification)return {};const lines=raw.trim().split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).filter(Boolean);const value=lines.length?JSON.parse(lines.at(-1)):JSON.parse(raw);if(value.error)throw new Error(value.error.message||'MCP request failed');return value}
async function connect(){if(connected)return;document.getElementById('java-status').textContent='● Connecting';await mcp('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'recovery-agent-demo-site',version:'0.3.0'}});await mcp('notifications/initialized',{},true);connected=true;document.getElementById('java-status').textContent='● Java MCP'}
async function tool(name,args={}){await connect();const value=await mcp('tools/call',{name,arguments:args});const result=value.result||value;const structured=result.structuredContent;if(structured&&Object.keys(structured).length)return structured;const text=result.content?.find(x=>x.type==='text')?.text;if(text){try{return JSON.parse(text)}catch{return {text}}}return result}
async function inspect(){try{const result=await tool('service_inspect',target);state.observation=result;record('Service inspection','Java service_inspect observed the configured target.',result,true);route='observe';toast('Live service observation loaded');render()}catch(e){record('Service inspection failed',e.message,{},false);toast('Java MCP error: '+e.message);render()}}
async function readiness(){try{const result=await tool('recovery_readiness',{});state.readiness=result;record('Policy and budget','Java recovery_readiness evaluated deterministic eligibility.',result,true);route='policy';toast('Readiness evaluated');render()}catch(e){record('Readiness failed',e.message,{},false);toast('Java MCP error: '+e.message);render()}}
async function recoverNow(){try{const result=await tool('recovery_recover',target);state.recovery=result;record('Bounded recovery','Trusted Java recovery_recover executed the configured action.',result,true);route='verify';toast('Bounded recovery completed');await verifyNow()}catch(e){record('Recovery failed',e.message,{},false);toast('Java recovery error: '+e.message);render()}}
async function verifyNow(){try{const result=await tool('service_inspect',target);state.verification=result;record('Fresh verification','A fresh Java service_inspect checked the post-action state.',result,result.healthy===true);route='verify';toast(result.healthy===true?'Authoritative health verified':'Verification still reports unhealthy');render()}catch(e){record('Verification failed',e.message,{},false);toast('Verification error: '+e.message);render()}}
async function loadMcp(){try{await connect();const list=await mcp('tools/list');state.tools=(list.result?.tools||[]).map(x=>x.name);route='mcp';toast('Live Java tool discovery loaded');render()}catch(e){toast('MCP discovery failed: '+e.message)}}
async function actions(action){if(action==='inspect')return inspect();if(action==='readiness')return readiness();if(action==='recover-now')return recoverNow();if(action==='verify-now')return verifyNow();if(action==='load-mcp')return loadMcp();if(titles[action]){route=action;render()}}
document.querySelectorAll('[data-route]').forEach(n=>n.addEventListener('click',()=>{route=n.dataset.route;render()}));
render();
</script>
</body>
</html>
