<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="420" viewBox="0 0 1250 420" role="img" aria-labelledby="title desc">
  <title id="title">Recovery Agent architecture</title>
  <desc id="desc">A bounded Strands control host persists typed recovery state and uses an outbound mutual TLS node session to restart a fixed systemd service, followed by fresh verification.</desc>
  <rect width="1250" height="420" fill="#08111f"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#f8fafc" text-anchor="middle">
    <g stroke="#93c5fd" stroke-width="2" fill="#172554">
      <rect x="25" y="170" width="145" height="75" rx="14"/><rect x="205" y="170" width="160" height="75" rx="14"/><rect x="400" y="170" width="170" height="75" rx="14"/><rect x="605" y="170" width="160" height="75" rx="14"/><rect x="800" y="170" width="155" height="75" rx="14"/><rect x="990" y="170" width="145" height="75" rx="14"/>
      <rect x="455" y="300" width="170" height="60" rx="14" fill="#713f12" stroke="#fbbf24"/>
    </g>
    <text x="98" y="200">MCP host</text><text x="98" y="223">/ Inspector</text><text x="285" y="200">Control host</text><text x="285" y="223">+ Strands</text><text x="485" y="200">Typed deterministic</text><text x="485" y="223">control plane</text><text x="685" y="200">Durable Java</text><text x="685" y="223">authority / PG</text><text x="877" y="200">TLS 1.3</text><text x="877" y="223">node session</text><text x="1062" y="200">Fixed systemd</text><text x="1062" y="223">service</text><text x="540" y="326">Named human approval</text><text x="540" y="348">outside model-facing MCP</text>
    <g stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M170 207H205"/><path d="M365 207H400"/><path d="M570 207H605"/><path d="M765 207H800"/><path d="M955 207H990"/><path d="M540 300V245"/></g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
</svg>
