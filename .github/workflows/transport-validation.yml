name: Secure transport validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-transport-e2e:
    name: Node transport E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run strict checks and tests
        run: npm run check

      - name: Verify npm package shape
        run: npm pack --dry-run --json
