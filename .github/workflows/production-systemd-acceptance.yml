name: Packaged Java systemd acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/production-systemd-acceptance.yml'
      - 'src/**'
      - 'state-authority/**'
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  packaged-systemd-recovery:
    name: Packaged Java loopback systemd recovery
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recovery-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical architecture tests
        uses: actions/checkout@v4
        with:
          repository: TavallStudios/Tavall-Architecture-Tests
          ref: main
          path: Tavall-Architecture-Tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build distributable package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:legacy
          export TAVALL_GRADLE_ARGUMENTS="--include-build $GITHUB_WORKSPACE/Tavall-Architecture-Tests"
          npm run package:runtime
          npm pack --ignore-scripts --silent > /tmp/recovery-tarball

      - name: Install clean control consumer and Inspector
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-control-consumer
          cd /tmp/recovery-control-consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$(cat /tmp/recovery-tarball)" --ignore-scripts --no-audit --no-fund
          npm install --no-save @modelcontextprotocol/inspector@2.5.0 --no-audit --no-fund

      - name: Create real systemd target and loopback node configuration
        run: |
          set -euo pipefail
          root=/tmp/recovery-acceptance
          mkdir -p "$root/node" "$root/target" "$root/logs"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin recovery-node-test
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin recovery-target-test
          sudo chown -R recovery-node-test:recovery-node-test "$root/node"
          sudo chown -R recovery-target-test:recovery-target-test "$root/target"

          sudo tee /etc/systemd/system/recovery-acceptance.service >/dev/null <<'UNIT'
          [Unit]
          Description=Recovery Agent physical Java acceptance target

          [Service]
          Type=simple
          User=recovery-target-test
          ExecStart=/bin/sh -c 'printf "%s\n" "$$" >> /tmp/recovery-acceptance/target/starts; exec /usr/bin/sleep infinity'
          Restart=no
          UNIT

          sudo install -d -o root -g root -m 0755 /opt/recovery-acceptance/bin
          sudo tee /opt/recovery-acceptance/bin/systemctl >/dev/null <<'WRAPPER'
          #!/bin/sh
          set -eu
          unit='recovery-acceptance.service'
          if [ "$#" -ge 2 ] && [ "$1" = 'show' ] && [ "$2" = "$unit" ]; then
            exec /bin/systemctl "$@"
          fi
          if [ "$#" -eq 2 ] && [ "$1" = 'restart' ] && [ "$2" = "$unit" ]; then
            exec /usr/bin/sudo -n /bin/systemctl restart "$unit"
          fi
          echo "Recovery acceptance systemctl wrapper rejected unsupported operation/target" >&2
          exit 77
          WRAPPER
          sudo chmod 0755 /opt/recovery-acceptance/bin/systemctl
          echo 'recovery-node-test ALL=(root) NOPASSWD: /bin/systemctl restart recovery-acceptance.service' \
            | sudo tee /etc/sudoers.d/recovery-agent-acceptance >/dev/null
          sudo chmod 0440 /etc/sudoers.d/recovery-agent-acceptance
          sudo visudo -cf /etc/sudoers.d/recovery-agent-acceptance
          sudo systemctl daemon-reload
          sudo systemctl start recovery-acceptance.service
          sudo systemctl is-active --quiet recovery-acceptance.service
          test "$(wc -l < "$root/target/starts")" -eq 1

          set +e
          sudo -u recovery-node-test env PATH="/opt/recovery-acceptance/bin:/usr/bin:/bin" \
            systemctl restart cron.service >/tmp/recovery-unauthorized-out 2>/tmp/recovery-unauthorized-err
          unauthorized_status=$?
          set -e
          test "$unauthorized_status" -ne 0
          grep -q 'rejected unsupported operation/target' /tmp/recovery-unauthorized-err

          cat > "$root/node/node.json" <<'JSON'
          {
            "nodeId": "physical-node",
            "transport": {
              "mode": "loopback_http",
              "listenHost": "127.0.0.1",
              "listenPort": 47844,
              "tokenEnvironmentVariable": "RECOVERY_NODE_TOKEN"
            },
            "services": [
              {
                "id": "acceptance-service",
                "unit": "recovery-acceptance.service"
              }
            ]
          }
          JSON
          cat > /tmp/recovery-control-consumer.json <<'JSON'
          {
            "transport": {"mode": "loopback_http"},
            "nodes": [
              {
                "id": "physical-node",
                "baseUrl": "http://127.0.0.1:47844",
                "tokenEnvironmentVariable": "RECOVERY_NODE_TOKEN",
                "services": [
                  {
                    "id": "acceptance-service",
                    "restartAllowed": true,
                    "maxRestartAttempts": 1,
                    "restartBudgetWindowSeconds": 600,
                    "watchEnabled": false
                  }
                ]
              }
            ]
          }
          JSON
          cp /tmp/recovery-control-consumer.json /tmp/recovery-control-consumer/control.json

      - name: Start packaged node infrastructure and Java control host
        working-directory: /tmp/recovery-control-consumer
        env:
          RECOVERY_NODE_TOKEN: test-node-token-physical-0123456789
          RECOVERY_AGENT_PORT: '47843'
          RECOVERY_STATE_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/recovery
          RECOVERY_STATE_DB_USERNAME: postgres
          RECOVERY_STATE_DB_PASSWORD: recovery-test-password
          RECOVERY_STATE_GENERATE_SCHEMA: 'true'
        run: |
          set -euo pipefail
          root=/tmp/recovery-acceptance
          sudo -u recovery-node-test env \
            HOME="$root/node" \
            PATH="/opt/recovery-acceptance/bin:/usr/bin:/bin" \
            RECOVERY_NODE_TOKEN="$RECOVERY_NODE_TOKEN" \
            node "$GITHUB_WORKSPACE/dist/cli/main.js" node "$root/node/node.json" \
            >"$root/logs/node.out" 2>"$root/logs/node.err" &
          echo $! > "$root/node-agent.pid"
          node ./node_modules/@tjxjnoobie/recovery-agent/bin/recovery-agent.mjs doctor
          node ./node_modules/@tjxjnoobie/recovery-agent/bin/recovery-agent.mjs mcp ./control.json \
            >"$root/logs/control.out" 2>"$root/logs/control.err" &
          echo $! > "$root/control-agent.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:47843/healthz >/tmp/recovery-control-health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:47843/healthz

      - name: Accept MCP Inspector against packaged Java HTTP MCP
        working-directory: /tmp/recovery-control-consumer
        run: |
          set -euo pipefail
          ./node_modules/.bin/mcp-inspector --cli \
            http://127.0.0.1:47843/mcp \
            --transport http \
            --method tools/list --format json > /tmp/recovery-inspector-tools.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const outer = JSON.parse(readFileSync('/tmp/recovery-inspector-tools.json', 'utf8'))
          const result = outer.result ?? outer
          const names = new Set((result.tools ?? []).map((tool) => tool.name))
          for (const required of ['service_inspect', 'recovery_recover', 'recovery_readiness']) {
            if (!names.has(required)) throw new Error('Inspector did not observe ' + required)
          }
          if (names.has('shell') || names.has('systemctl')) throw new Error('Inspector observed an arbitrary execution tool')
          NODE

      - name: Recover stopped real systemd service through Java MCP
        working-directory: /tmp/recovery-control-consumer
        env:
          RECOVERY_NODE_TOKEN: test-node-token-physical-0123456789
          RECOVERY_AGENT_PORT: '47843'
          RECOVERY_STATE_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/recovery
          RECOVERY_STATE_DB_USERNAME: postgres
          RECOVERY_STATE_DB_PASSWORD: recovery-test-password
          RECOVERY_STATE_GENERATE_SCHEMA: 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const endpoint = 'http://127.0.0.1:47843/mcp'
          let session
          let nextId = 1
          async function request(method, params = {}) {
            if (session === undefined) {
              const init = await fetch(endpoint, {
                method: 'POST',
                headers: {'content-type': 'application/json', accept: 'application/json, text/event-stream'},
                body: JSON.stringify({jsonrpc:'2.0', id:nextId++, method:'initialize', params:{
                  protocolVersion:'2025-11-25', capabilities:{}, clientInfo:{name:'physical-java-acceptance',version:'1'}
                }}),
              })
              if (!init.ok) throw new Error('initialize HTTP ' + init.status)
              session = init.headers.get('mcp-session-id')
              if (session === null) throw new Error('initialize returned no MCP session')
            }
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {'content-type':'application/json', accept:'application/json, text/event-stream', 'mcp-session-id':session},
              body: JSON.stringify({jsonrpc:'2.0', id:nextId++, method, params}),
            })
            const body = await response.text()
            if (!response.ok) throw new Error(method + ' HTTP ' + response.status + ': ' + body)
            const line = body.split(/\r?\n/).findLast((entry) => entry.startsWith('data: '))
            const envelope = JSON.parse(line === undefined ? body : line.slice('data: '.length))
            if (envelope.error) throw new Error(JSON.stringify(envelope.error))
            return envelope.result?.structuredContent ?? envelope.result
          }
          async function tool(name, args) {
            return request('tools/call', {name, arguments:args})
          }
          const listed = await request('tools/list')
          const names = new Set((listed.tools ?? []).map((entry) => entry.name))
          for (const required of ['service_inspect','recovery_readiness','recovery_recover']) {
            if (!names.has(required)) throw new Error('Java MCP did not publish ' + required)
          }
          const target = {nodeId:'physical-node', serviceId:'acceptance-service'}
          let before
          for (let attempt = 0; attempt < 15; attempt++) {
            before = await tool('service_inspect', target)
            if (before.healthy === true && before.lifecycleState === 'running') break
            await new Promise((resolve) => setTimeout(resolve, 500))
          }
          if (before?.healthy !== true || before.lifecycleState !== 'running') throw new Error('initial target was not healthy: ' + JSON.stringify(before))
          execFileSync('sudo', ['systemctl','stop','recovery-acceptance.service'], {stdio:'inherit'})
          const unhealthy = await tool('service_inspect', target)
          if (unhealthy.healthy === true || unhealthy.lifecycleState === 'running') throw new Error('target did not become unhealthy')
          const readiness = await tool('recovery_readiness')
          if (readiness.services?.[0]?.decision !== 'RESTART' || readiness.services?.[0]?.mutationAvailable !== true) throw new Error('policy did not expose the trusted mutation boundary: ' + JSON.stringify(readiness))
          const recovered = await tool('recovery_recover', target)
          if (recovered.status !== 'RECOVERED' || recovered.recovery?.after?.healthy !== true) throw new Error('recovery was not verified: ' + JSON.stringify(recovered))
          execFileSync('sudo', ['systemctl','is-active','--quiet','recovery-acceptance.service'], {stdio:'inherit'})
          const starts = readFileSync('/tmp/recovery-acceptance/target/starts','utf8').trim().split(/\r?\n/).filter(Boolean)
          if (starts.length !== 2) throw new Error('expected one restart, observed ' + starts.length + ' starts')
          const verified = await tool('service_inspect', target)
          if (verified.healthy !== true || verified.lifecycleState !== 'running') throw new Error('fresh verification was not healthy: ' + JSON.stringify(verified))
          console.log(JSON.stringify({
            evidence:'PACKAGED JAVA LOOPBACK SYSTEMD ACCEPTANCE',
            recoveryStatus:recovered.status,
            resultingLifecycleState:verified.lifecycleState,
            resultingHealthy:verified.healthy,
            targetStartCount:starts.length,
            policyMutationAvailable:readiness.services[0].mutationAvailable
          }, null, 2))
          NODE

      - name: Cleanup physical acceptance runtime
        if: always()
        run: |
          set +e
          if [ -f /tmp/recovery-acceptance/control-agent.pid ]; then kill "$(cat /tmp/recovery-acceptance/control-agent.pid)" 2>/dev/null; fi
          if [ -f /tmp/recovery-acceptance/node-agent.pid ]; then sudo kill "$(cat /tmp/recovery-acceptance/node-agent.pid)" 2>/dev/null; fi
          sudo systemctl stop recovery-acceptance.service 2>/dev/null
          sudo rm -f /etc/systemd/system/recovery-acceptance.service
          sudo rm -f /etc/sudoers.d/recovery-agent-acceptance
          sudo rm -rf /opt/recovery-acceptance
          sudo systemctl daemon-reload 2>/dev/null
          sudo userdel recovery-node-test 2>/dev/null
          sudo userdel recovery-target-test 2>/dev/null
