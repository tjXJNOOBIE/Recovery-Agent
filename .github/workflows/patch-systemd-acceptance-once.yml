name: One-shot acceptance harness liveness correction

on:
  push:
    branches:
      - working/physical-systemd-recovery-acceptance
    paths:
      - .github/workflows/patch-systemd-acceptance-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: working/physical-systemd-recovery-acceptance

      - name: Patch restricted node liveness check
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/production-systemd-acceptance.yml')
          text = path.read_text()
          old = '''          sudo -u recovery-node-test env \\
            HOME="$root/node" \\
            PATH="/opt/recovery-acceptance/bin:/usr/bin:/bin" \\
            /usr/bin/node "$package_root/dist/cli/main.js" node "$root/node/node.json" \\
            >"$root/logs/node.out" 2>"$root/logs/node.err" &
          echo $! > "$root/node-agent.pid"
          sleep 1
          kill -0 "$(cat "$root/node-agent.pid")"
'''
          new = '''          sudo -u recovery-node-test env \\
            HOME="$root/node" \\
            PATH="/opt/recovery-acceptance/bin:/usr/bin:/bin" \\
            /usr/bin/node "$package_root/dist/cli/main.js" node "$root/node/node.json" \\
            >"$root/logs/node.out" 2>"$root/logs/node.err" &
          echo $! > "$root/node-launcher.pid"
          sleep 1

          node_pid="$(pgrep -u recovery-node-test -f 'dist/cli/main.js node /tmp/recovery-acceptance/node/node.json' | head -n 1 || true)"
          if [ -z "$node_pid" ]; then
            echo 'Packaged restricted node exited unexpectedly.' >&2
            echo '--- node stderr ---' >&2
            cat "$root/logs/node.err" >&2 || true
            echo '--- node stdout ---' >&2
            cat "$root/logs/node.out" >&2 || true
            echo '--- recovery-node-test process table ---' >&2
            ps -fu recovery-node-test >&2 || true
            exit 1
          fi
          echo "$node_pid" > "$root/node-agent.pid"
'''
          if old not in text:
              raise SystemExit('expected restricted-node startup block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Recovery Agent Acceptance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-systemd-acceptance-once.yml
          git add .github/workflows/production-systemd-acceptance.yml
          git diff --cached --check
          git commit -m 'Test: track actual restricted node process in acceptance'
          git push origin HEAD:working/physical-systemd-recovery-acceptance
