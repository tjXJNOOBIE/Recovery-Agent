name: Codex Recovery E2E Handoff

on:
  push:
    branches:
      - working/java-first-strands-mcp
    paths:
      - .github/workflows/codex-recovery-e2e-handoff.yml
  workflow_dispatch:

concurrency:
  group: codex-recovery-e2e-handoff
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  codex-e2e:
    name: Full-permission Codex E2E continuation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout live Recovery migration branch
        uses: actions/checkout@v5
        with:
          ref: working/java-first-strands-mcp
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile branch and configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin working/java-first-strands-mcp
          git checkout working/java-first-strands-mcp
          git pull --ff-only origin working/java-first-strands-mcp
          git config user.name "Codex Recovery Worker"
          git config user.email "codex-recovery-worker@users.noreply.github.com"
          git status --short --branch

      - name: Verify a Codex API credential is available
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${CODEX_API_KEY:-}" ]; then
            echo "Codex credential is configured."
            exit 0
          fi
          echo "::error::Neither OPENAI_API_KEY nor CODEX_API_KEY is configured for this repository/organization."
          exit 1

      # Keep this as the final step. The run is intentionally unrestricted on a disposable GitHub-hosted VM.
      - name: Hand Recovery migration to Codex CLI
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          prompt-file: .codex/RECOVERY_E2E_HANDOFF.md
          working-directory: ${{ github.workspace }}
          effort: high
          safety-strategy: unsafe
          codex-args: '["--dangerously-bypass-approvals-and-sandbox", "--search"]'
          output-file: /tmp/recovery-codex-final-message.txt
          allow-users: tjXJNOOBIE
