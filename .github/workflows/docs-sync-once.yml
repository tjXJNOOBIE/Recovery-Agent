name: One-shot production transport docs sync

on:
  push:
    branches:
      - working/secure-node-transport-lifecycle
    paths:
      - .github/workflows/docs-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: working/secure-node-transport-lifecycle

      - name: Reconcile transport documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(
              r'> \*\*Current status:\*\* Draft E2E foundation\..*?remain promotion gates\.',
              '> **Current status:** E2E Recovery runtime with durable control state and production outbound mTLS node transport. Deterministic recovery, application probes, Linux/node/certificate/deployment watches, Recovery Readiness, semantic watches, dependency-aware rolling budgets, bounded Strands roles, accountable local operator principals, restart-safe schema-v2 durability, terminal-history retention, packaged control-host installation, TLS 1.3 mutual authentication, node/control certificate pinning, bounded reconnect, and credential-file rotation are implemented. GitHub validation physically exercises Node 22, Java 25, PostgreSQL 17, packaged installation, and real generated-certificate transport. Authorized real-model Recovery validation, broader production actions/adapters, and current-host/Inspector acceptance remain promotion gates.',
              text,
              count=1,
          )
          text = text.replace('          -> typed node HTTP gateways\n', '          -> typed node gateways\n              -> production: outbound TLS 1.3 session gateways\n              -> compatibility/demo: loopback bearer HTTP only\n')
          text = text.replace(
              "```bash\nexport RECOVERY_NODE_TOKEN_EAST_01='replace-with-a-long-random-secret'\nrecovery-agent node ./node.json\n```",
              "```bash\nrecovery-agent node ./node.json\n```\n\nProduction node configuration uses `transport.mode = \"outbound_tls\"`, file-backed certificate/private-key/CA paths, an expected control-host certificate fingerprint allowlist, and bounded reconnect settings. The node initiates the connection; it does not expose a production Recovery listener. Private keys must be regular files and, on POSIX systems, must be owned by the Recovery process user with no group/other permissions.",
          )
          text = text.replace(
              'The node HTTP transport currently defaults to loopback. Public-network production use is **not** claimed until outbound enrollment, mTLS, credential rotation, and production remote transport are implemented.',
              'Bearer HTTP exists only as `loopback_http` compatibility for local development and the explicitly simulated demo. Non-loopback plaintext configuration is rejected. Production uses outbound TLS 1.3 mutual authentication. Node credentials are re-read before every reconnect attempt, so rotation is performed by overlapping allowed fingerprints, installing replacement files, reconnecting, verifying the new identity, and then retiring the old fingerprint.',
          )
          text = text.replace("export RECOVERY_NODE_TOKEN_EAST_01='replace-with-the-same-secret'\n", '')
          marker = '## Durable control state\n'
          transport_section = '''## Production node transport\n\nProduction nodes initiate outbound TLS 1.3 sessions to the control host. Mutual TLS authenticates both sides, the control host binds the declared Recovery node ID to an explicit SHA-256 client-certificate fingerprint allowlist, and the node verifies the control host through CA/hostname validation plus its own fingerprint allowlist. The application protocol remains versioned, bounded newline-delimited JSON with only the existing typed inspect/restart capability family.\n\nThe control host exposes one authenticated session slot per configured node. Session loss rejects pending requests and is observed as node unreachability without hiding healthy fleet members. The node reconnect lifecycle owns one session, reloads certificate/key/CA material before each attempt, resets delay after successful enrollment, exponentially backs off to a configured ceiling, and interrupts sleeps during shutdown.\n\nCredential rotation is overlap-based rather than remotely mutable: configure old+new fingerprints during transition, install the new local certificate/key files, allow reconnect to prove the new identity, then remove the retired fingerprint. MCP/AI receives no credential-management or transport-control capability.\n\n`loopback_http` remains only a migration/local-demo compatibility mode. Both node listener configuration and control gateway URLs fail closed when plaintext would leave loopback.\n\n'''
          if transport_section not in text:
              text = text.replace(marker, transport_section + marker, 1)
          text = text.replace('- outbound production node enrollment, mTLS, credential rotation, and remote transport;\n', '')
          readme.write_text(text)

          draft = Path('docs/recovery-agent/RECOVERY_AGENT_FINAL_DRAFT.md')
          text = draft.read_text()
          text = text.replace('- future production enrollment infrastructure owns remote node identity, mTLS, and credential lifecycle.\n', '- Recovery Agent owns its product-specific outbound node transport, node/control identity binding, reconnect policy, and credential-rotation contract; PKI issuance outside Recovery remains an operator/infrastructure responsibility.\n')
          text = text.replace('          -> node HTTP gateways\n', '          -> node gateways\n              -> production outbound TLS 1.3 session gateways\n              -> loopback bearer HTTP compatibility only\n')
          old = '''## Node Boundary\n\nThe node server exposes authenticated typed operations including:\n\n```text\nGET  /v1/node\nGET  /v1/services/:serviceId\nPOST /v1/services/:serviceId/restart\nGET  /v1/certificates\n```\n\nPublic service IDs map to fixed configured systemd units. Remote/model callers cannot supply unit names, shell commands/arguments, app-health URLs/ports, certificate targets, or deployment marker paths.\n\nThe current node HTTP transport defaults to loopback and a per-node Bearer secret from environment configuration. Public Internet deployment is not claimed. Outbound enrollment, mTLS, rotation, and production remote transport remain required.\n'''
          new = '''## Node Boundary\n\nProduction nodes initiate outbound TLS 1.3 sessions to the control host. The versioned bounded protocol exposes only typed `inspect_node`, `inspect_service`, `inspect_certificates`, and `restart_service` operations. Public service IDs map to fixed configured systemd units. Remote/model callers cannot supply unit names, shell commands/arguments, app-health URLs/ports, certificate targets, deployment marker paths, credentials, or arbitrary RPC payloads.\n\nMutual TLS authenticates both sides. The control host binds the declared Recovery node ID to an explicit SHA-256 client-certificate fingerprint allowlist. The node verifies control-host CA/hostname identity and an explicit control-certificate fingerprint allowlist. One active authenticated session is allowed per configured node. Requests are correlated, bounded, timed out, and rejected on session loss.\n\nThe node reconnect lifecycle reloads certificate/private-key/CA files before each attempt, uses bounded exponential backoff, resets backoff after successful enrollment, and stops promptly during shutdown. On POSIX systems private-key files fail closed when they are symlinks, owned by another user, or grant group/other permissions. Rotation uses explicit old/new fingerprint overlap: install the new local files, reconnect and verify the new identity, then retire the old fingerprint. No model-facing credential or transport mutation API exists.\n\nLegacy HTTP endpoints (`GET /v1/node`, `GET /v1/services/:serviceId`, `POST /v1/services/:serviceId/restart`, `GET /v1/certificates`) remain only under explicit/legacy `loopback_http` compatibility for local development and the simulated demo. Non-loopback plaintext node listeners and control URLs are rejected.\n'''
          if old not in text:
              raise SystemExit('expected Node Boundary block not found')
          text = text.replace(old, new, 1)
          draft.write_text(text)

      - name: Commit reconciled docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Recovery Agent Docs Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/recovery-agent/RECOVERY_AGENT_FINAL_DRAFT.md
          git diff --cached --check
          git commit -m 'Docs: reconcile production outbound mTLS lifecycle'
          git push origin HEAD:working/secure-node-transport-lifecycle
