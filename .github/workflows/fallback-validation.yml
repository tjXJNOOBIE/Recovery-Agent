name: Fallback validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  typescript:
    name: TypeScript E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check

  durable-state:
    name: Java durable state authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run state authority tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle -p state-authority test --stacktrace

  package-e2e:
    name: Packaged control-host E2E
    needs: [typescript, durable-state]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recovery-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Checkout canonical architecture tests for package build
        uses: actions/checkout@v4
        with:
          repository: TavallStudios/Tavall-Architecture-Tests
          ref: main
          path: Tavall-Architecture-Tests
      - name: Install source dependencies
        run: npm install --no-audit --no-fund
      - name: Build real npm tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TAVALL_GRADLE_ARGUMENTS="--include-build $GITHUB_WORKSPACE/Tavall-Architecture-Tests"
          npm pack --silent > /tmp/recovery-package-name
          tail -n 1 /tmp/recovery-package-name > /tmp/recovery-tarball
      - name: Install tarball into clean consumer
        run: |
          mkdir -p /tmp/recovery-consumer
          cd /tmp/recovery-consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$(cat /tmp/recovery-tarball)" --no-audit --no-fund
      - name: Verify installed authority payload
        run: |
          PACKAGE_ROOT=/tmp/recovery-consumer/node_modules/@tjxjnoobie/recovery-agent
          test -x "$PACKAGE_ROOT/runtime/bin/recovery-agent"
          test -f "$PACKAGE_ROOT/runtime-manifest.json"
          find "$PACKAGE_ROOT/runtime/lib" -type f -name 'recovery-agent-*.jar' -print -quit | grep -q .
          find "$PACKAGE_ROOT/runtime/lib" -type f -name 'state-authority-*.jar' -print -quit | grep -q .
      - name: Run installed Java control host over MCP
        working-directory: /tmp/recovery-consumer
        env:
          RECOVERY_NODE_TOKEN_PACKAGE: test-node-token-1234567890
          RECOVERY_AGENT_PORT: '37844'
        run: |
          cat > control.json <<'JSON'
          {
            "nodes": [
              {
                "id": "package-node",
                "baseUrl": "http://127.0.0.1:65534",
                "tokenEnvironmentVariable": "RECOVERY_NODE_TOKEN_PACKAGE",
                "services": [
                  {
                    "id": "package-service",
                    "restartAllowed": false,
                    "maxRestartAttempts": 0,
                    "watchEnabled": false
                  }
                ]
              }
            ]
          }
          JSON
          set +e
          timeout 15s npx --no-install recovery-agent mcp ./control.json </dev/null >/tmp/recovery-mcp-output 2>/tmp/recovery-mcp-error
          exit_code=$?
          set -e
          test "$exit_code" -eq 124
          grep -q 'Recovery Agent Java operator MCP:' /tmp/recovery-mcp-output
          grep -q 'recovery_recover is trusted-operator-only' /tmp/recovery-mcp-output
