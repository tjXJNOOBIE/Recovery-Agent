name: Recovery validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-e2e:
    name: Node E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run strict checks and tests
        run: npm run check:legacy

      - name: Verify npm package shape
        run: npm pack --dry-run --ignore-scripts --json

      - name: Verify demo truthfulness label
        shell: bash
        run: |
          set -euo pipefail
          output="$(npm run --silent demo:legacy)"
          printf '%s\n' "$output" | grep -F 'SIMULATED DEMONSTRATION'
